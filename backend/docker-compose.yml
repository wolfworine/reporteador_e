services:
  localstack:
    image: localstack/localstack:3
    container_name: entel-role-repository-localstack
    ports:
      - "4566:4566"
    environment:
      # Solo los servicios AWS que este backend necesita emular (feature 2 de
      # feature_list.json). Ninguna credencial real -- LocalStack acepta
      # cualquier access-key-id/secret-access-key y el proyecto usa siempre
      # "test"/"test" (ver src/main/resources/application.properties, perfil
      # %dev).
      - SERVICES=dynamodb,secretsmanager,kms
      - DEBUG=0
      - DEFAULT_REGION=us-east-1
      # PERSISTENCE=1 (agregado 2026-08-25, bug real: "no inicia con mis
      # usuarios"): sin esto, LocalStack guarda DynamoDB solo en memoria del
      # contenedor -- cualquier `docker compose down`/recreación del
      # contenedor (incluida la que hace `start.sh` cuando el contenedor
      # previo ya no existe) borraba los ~17,873 items migrados del legado
      # (usuarios reales, menú real, roles/atributos/suministros) sin ningún
      # aviso, dejando login/menú vacíos hasta volver a correr la migración
      # a mano. Con esto, el estado persiste en el volumen `localstack-data`
      # de abajo y sobrevive a un `docker compose down`+`up` normal (NO a un
      # `docker volume rm`/`docker compose down -v` explícito).
      - PERSISTENCE=1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "localstack-data:/var/lib/localstack"
    healthcheck:
      # `\(available\|running\)` (no solo `available`) -- corregido
      # 2026-08-25, bug real encontrado al validar este archivo: LocalStack
      # 3.8.1 (la imagen `:3` resuelve a esa versión) reporta `dynamodb`
      # como `"running"` una vez arriba, nunca `"available"` en este
      # entorno -- el contenedor quedaba marcado `unhealthy` para siempre
      # aunque funcionara (confirmado con `curl .../_localstack/health`
      # directo). Mismo criterio que ya usa correctamente
      # `database/docker-compose.yml` para esta misma imagen.
      test:
        - "CMD-SHELL"
        - "curl -sf http://localhost:4566/_localstack/health | grep -q '\"dynamodb\": \"\\(available\\|running\\)\"' && curl -sf http://localhost:4566/_localstack/health | grep -q '\"secretsmanager\": \"\\(available\\|running\\)\"'"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Kafka (feature 9: reportes_generacion_async_kafka) -- agregado 2026-08-25
  # (pedido explícito del usuario: "todo esto en un docker compose", al ver
  # que `mvn quarkus:dev` dejaba contenedores `apache/kafka-native` y
  # `testcontainers-ryuk-*` sueltos fuera de cualquier `docker-compose`).
  # `docs/verification.md` ya documentaba `docker-compose up -d localstack
  # kafka` como el flujo esperado desde la feature 9, pero el servicio nunca
  # se había agregado a este archivo -- sin `kafka.bootstrap.servers`
  # configurado en `%dev`, Quarkus Dev Services levantaba su propio broker
  # efímero vía Testcontainers (de ahí el contenedor Kafka con nombre
  # aleatorio + el reaper `ryuk` que lo acompaña) en cada `mvn quarkus:dev`.
  # Un solo nodo en modo KRaft combinado (broker+controller, sin Zookeeper --
  # eliminado por completo en Kafka 4.x) es suficiente para desarrollo local;
  # mismo tag de imagen (`4.2.0`, variante JVM en vez de `-native` por tener
  # la interfaz de variables de entorno estándar y mejor documentada) que el
  # que Dev Services ya venía usando, para no cambiar de versión de broker.
  kafka:
    image: apache/kafka:4.2.0
    container_name: entel-role-repository-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Listener interno (para otros contenedores de esta red, sin uso hoy)
      # + listener expuesto al host (`mvn quarkus:dev` corre fuera de
      # Docker) -- mismo patrón que el quickstart oficial de kafka.apache.org.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Backend (agregado 2026-08-25, mismo pedido que Kafka más arriba: "todo
  # esto en un docker compose" -- hasta ahora este `docker-compose.yml` solo
  # traía la infra (LocalStack/Kafka) y la app corría aparte, a mano, con
  # `mvn quarkus:dev`). Usa el `Dockerfile.jvm` que Quarkus ya generaba en
  # `src/main/docker/` (sin tocar) -- ese Dockerfile espera el jar YA
  # compilado en `target/quarkus-app/` (ver su propio comentario de cabecera),
  # así que hace falta `./mvnw package` (o `-DskipTests` si ya corriste `mvn
  # test` antes) ANTES de `docker compose build backend`/`up --build`; no es
  # un build multi-stage que compile desde código fuente dentro de la imagen.
  #
  # Corre con el profile `prod` por defecto (el jar empaquetado, no
  # `quarkus:dev`) -- las propiedades `%dev.*` de `application.properties`
  # NO aplican acá. Los endpoints de abajo se pasan como variables de entorno
  # (tienen prioridad sobre `application.properties` en cualquier profile) en
  # vez de agregar un bloque `%prod.*` nuevo -- `%prod` está reservado en
  # este archivo para credenciales de AWS real ("Pendiente de credenciales
  # productivas", ver `docs/architecture.md`), y estos endpoints son
  # LocalStack, no AWS real. `localstack`/`kafka` (no `localhost`) porque acá
  # sí corre DENTRO de la red del compose, a diferencia de `mvn quarkus:dev`
  # en el host -- por eso usa el listener interno `kafka:19092`, no el
  # `PLAINTEXT_HOST` de `localhost:9092`.
  backend:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: entel-role-repository-backend
    ports:
      - "8080:8080"
    depends_on:
      localstack:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      QUARKUS_DYNAMODB_AWS_REGION: us-east-1
      QUARKUS_DYNAMODB_AWS_CREDENTIALS_TYPE: static
      QUARKUS_DYNAMODB_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID: test
      QUARKUS_DYNAMODB_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY: test
      QUARKUS_DYNAMODB_ENDPOINT_OVERRIDE: http://localstack:4566
      QUARKUS_SECRETSMANAGER_AWS_REGION: us-east-1
      QUARKUS_SECRETSMANAGER_AWS_CREDENTIALS_TYPE: static
      QUARKUS_SECRETSMANAGER_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID: test
      QUARKUS_SECRETSMANAGER_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY: test
      QUARKUS_SECRETSMANAGER_ENDPOINT_OVERRIDE: http://localstack:4566
      # Mismo origen que ya habilita `%dev.quarkus.http.cors.*` -- el
      # frontend (`npm run dev`, puerto 5173) sigue corriendo en el host, no
      # en este compose, así que el navegador sigue haciendo una llamada
      # cross-origin real hacia este contenedor.
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:5173
      QUARKUS_HTTP_CORS_METHODS: GET,POST,PUT,DELETE,OPTIONS
      QUARKUS_HTTP_CORS_HEADERS: Content-Type,Accept
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sf http://localhost:8080/q/health >/dev/null 2>&1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  # Named volume (no bind mount): sobrevive a `docker compose down` +
  # `up -d` (lo que hace `start.sh`/`stop.sh` en uso normal); solo se borra
  # con `docker compose down -v` o `docker volume rm` explícitos.
  localstack-data:
