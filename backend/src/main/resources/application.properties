mp.messaging.incoming.words-in.auto.offset.reset=earliest
mp.messaging.incoming.words-in.topic=words
mp.messaging.outgoing.words-out.topic=words

# ---------------------------------------------------------------------------
# Reportes asincronos via Kafka (feature 9: reportes_generacion_async_kafka)
# ---------------------------------------------------------------------------
# Canales Quarkus/SmallRye -> topico fisico Kafka. Nombres de canal de
# entrada/salida distintos para el mismo topico (mismo patron que
# words-in/words-out del demo de MyMessagingApplication) porque un mismo
# proceso no puede tener @Incoming y @Outgoing sobre el MISMO nombre de
# canal sin ambiguedad.
#
# report.requested: productor = web/ReporteGenerarResource (POST
# /api/reportes/generar), consumidor = messaging/ReporteRequestWorker.
mp.messaging.outgoing.report-requested-out.topic=report.requested
mp.messaging.incoming.report-requested-in.topic=report.requested

# Garantia de entrega (docs/kafka-reactive-guidance.md): at-least-once +
# consumidor idempotente, NO exactly-once transaccional. acks=all +
# enable.idempotence=true explicitos en el productor (no dejado al default
# del entorno) -- sin esto un timeout+retry del broker podria duplicar el
# mensaje "generar reporte X" y disparar el worker dos veces para el mismo
# id (el chequeo de estado persistido en ReporteRequestWorker es la defensa
# real, esto reduce cuantas veces hace falta usarla).
mp.messaging.outgoing.report-requested-out.acks=all
mp.messaging.outgoing.report-requested-out.enable.idempotence=true

# NO auto-commit / NO "latest": throttled hace commit del offset solo
# despues de que ReporteRequestWorker.onReportRequested completa
# exitosamente su Uni -- si el worker crashea a mitad de la generacion del
# PDF/Excel, el mensaje no se pierde (se re-entrega al reiniciar).
mp.messaging.incoming.report-requested-in.auto.offset.reset=earliest
mp.messaging.incoming.report-requested-in.commit-strategy=throttled

# report.ready: publicado por messaging/ReporteRequestWorker al terminar
# exitosamente. Sin consumidor en esta feature (la feature 10, SSE, lo
# consumira).
mp.messaging.outgoing.report-ready-out.topic=report.ready
mp.messaging.outgoing.report-ready-out.acks=all
mp.messaging.outgoing.report-ready-out.enable.idempotence=true

# report.failed: publicado por messaging/ReporteRequestWorker cuando se
# agotan los reintentos (poison pill, MAX_INTENTOS=3) y el reporte queda en
# estado ERROR. Sin consumidor en esta feature.
mp.messaging.outgoing.report-failed-out.topic=report.failed
mp.messaging.outgoing.report-failed-out.acks=all
mp.messaging.outgoing.report-failed-out.enable.idempotence=true

# Perfil %dev: apunta al Kafka de `docker-compose.yml` (`docker-compose up -d
# kafka`) en vez de dejar que Quarkus Dev Services levante su propio broker
# efímero vía Testcontainers -- agregado 2026-08-25 (pedido explícito del
# usuario: "todo esto en un docker compose", al ver contenedores
# `apache/kafka-native`/`testcontainers-ryuk-*` sueltos, fuera de cualquier
# `docker-compose`, después de cada `mvn quarkus:dev`). Fijar
# `kafka.bootstrap.servers` es justamente lo que Quarkus documenta para
# desactivar Dev Services de Kafka -- no hace falta ningún flag adicional.
# Perfil %test se deja SIN esta propiedad a propósito, mismo razonamiento
# que LocalStack más abajo: Dev Services ya cubre `mvn test` de forma
# autocontenida, sin depender de que este `docker-compose` esté corriendo.
%dev.kafka.bootstrap.servers=localhost:9092

# ---------------------------------------------------------------------------
# LocalStack (feature 2 de feature_list.json: setup_localstack_dynamodb_secretsmanager)
# ---------------------------------------------------------------------------
# Ningun endpoint ni credencial de AWS real vive en este archivo -- solo las
# credenciales dummy que exige el AWS SDK v2 para hablar con LocalStack
# (access-key-id/secret-access-key = "test"/"test", como documenta LocalStack
# mismo). Ver docs/architecture.md y docs/conventions.md.
#
# Perfil %dev: apunta DynamoDbAsyncClient y SecretsManagerAsyncClient al
# LocalStack levantado a mano vía `docker-compose up -d localstack` (ver
# docker-compose.yml en la raiz de backend/), para el flujo manual
# `docker-compose up -d localstack` + `mvn quarkus:dev`.
#
# Bug encontrado y corregido en la feature 11 (aws_secrets_manager_integration):
# las dos claves de abajo vivian como "...sdk.endpoint-override" desde la
# feature 2, pero esa key no existe en quarkus-amazon-dynamodb/
# quarkus-amazon-secretsmanager 3.21.1 (confirmado inspeccionando
# META-INF/quarkus-config-doc/quarkus-config-model.json del jar de la
# extensión: la propiedad real es "quarkus.<servicio>.endpoint-override",
# sin el segmento "sdk"). Quarkus no falla el build por una key
# desconocida, solo la ignora en silencio -- el sintoma nunca se detecto
# porque "mvn test" usa Dev Services (que inyecta su propio
# endpoint-override correcto en tiempo de ejecucion, sin pasar por este
# archivo) y ningun test ejercita el perfil %dev. En la practica esto
# rompia el flujo manual documentado (`docker-compose up -d localstack` +
# `mvn quarkus:dev`): el cliente real intentaba hablar con AWS de verdad
# en vez de con LocalStack.
%dev.quarkus.dynamodb.aws.region=us-east-1
%dev.quarkus.dynamodb.aws.credentials.type=static
%dev.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test
%dev.quarkus.dynamodb.endpoint-override=http://localhost:4566

%dev.quarkus.secretsmanager.aws.region=us-east-1
%dev.quarkus.secretsmanager.aws.credentials.type=static
%dev.quarkus.secretsmanager.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.secretsmanager.aws.credentials.static-provider.secret-access-key=test
%dev.quarkus.secretsmanager.endpoint-override=http://localhost:4566

# Perfil %test: se deja SIN endpoint-override a propósito. Quarkus Dev
# Services (extensiones quarkus-amazon-dynamodb / quarkus-amazon-secretsmanager)
# ya levanta automáticamente un contenedor LocalStack efímero (vía
# Testcontainers/Docker) para @QuarkusTest y le inyecta endpoint-override +
# credenciales test/test en tiempo de arranque -- exactamente como ya
# ocurrió con Kafka+DynamoDB en la feature 1 (ver progress/history.md). Fijar
# aquí un endpoint-override fijo (p.ej. localhost:4566) rompería ese
# auto-arranque y obligaría a tener `docker-compose up -d localstack`
# corriendo manualmente antes de `mvn test`, lo cual violaría la regla de
# "mvn test sin errores" de forma autocontenida (docs/conventions.md,
# AGENTS.md §3). El contenedor de Dev Services ya cubre dynamodb +
# secretsmanager (+ kms, usado en features futuras) en un único LocalStack
# compartido.

# ---------------------------------------------------------------------------
# CORS (encontrado y corregido 2026-08-19, coordinación cross-track)
# ---------------------------------------------------------------------------
# Ausente por completo hasta hoy -- Quarkus deshabilita CORS por defecto, así
# que CUALQUIER llamada del frontend real (`npm run dev`, puerto 5173) a este
# backend (`quarkus:dev`, puerto 8080) fallaba en el navegador con "Failed to
# fetch" (bloqueada por el navegador antes de que la respuesta llegue a JS,
# ni siquiera aparece como error HTTP) -- nunca detectado porque los 61 tests
# del frontend mockean `api/*.ts` por completo (sin fetch real, sin CORS
# involucrado) y los 95 tests del backend usan RestAssured (cliente HTTP
# server-side, tampoco sujeto a CORS). La integración real navegador↔backend
# nunca se había ejercitado hasta esta sesión. Scoped a `%dev` (el único
# perfil donde frontend y backend corren en dev servers de puertos
# distintos); `%test` no lo necesita (RestAssured) y `%prod` queda pendiente
# de decidir según cómo se sirva el frontend en ese ambiente.
#
# Ojo con el nombre de la propiedad -- mismo patrón de bug que la feature 11
# (endpoint-override con un segmento de más): la forma corta
# `quarkus.http.cors=true` (válida en versiones viejas de Quarkus) NO
# resuelve nada en la 3.38.1 realmente usada aquí -- Quarkus ignora la key
# desconocida en silencio, sin fallar el build, exactamente como con
# `sdk.endpoint-override`. Confirmado extrayendo
# `META-INF/quarkus-config-doc/quarkus-config-model.json` del jar de
# `quarkus-vertx-http:3.38.1`: la propiedad real es
# `quarkus.http.cors.enabled`.
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:5173
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%dev.quarkus.http.cors.headers=Content-Type,Accept

# ---------------------------------------------------------------------------
# Resolución de secretos en el arranque (feature 11: aws_secrets_manager_integration)
# ---------------------------------------------------------------------------
# infra/AppSecretsBootstrap.java lee (y, si es la primera vez, autoprovisiona)
# el secreto "app/dynamodb/table-name" en Secrets Manager al arrancar
# Quarkus, vía SecretsManagerAsyncClient -- misma configuración de
# región/credenciales/endpoint-override que ya declaran las líneas de
# arriba, sin ninguna propiedad adicional aquí. Ver docs/architecture.md
# ("Resolución de secretos por ambiente") para el detalle completo,
# incluyendo por qué se eligió este bean de arranque en vez del
# ConfigSourceFactory nativo de la extensión
# (quarkus.secretsmanager.config.secrets, confirmado presente en
# quarkus-amazon-secretsmanager 3.21.1 pero no habilitado en este archivo).

# ---------------------------------------------------------------------------
# Snapshot en memoria + idempotencia de reportes (infra/SnapshotCache)
# ---------------------------------------------------------------------------
# ttl: mientras un snapshot sea mas joven que esto se sirve sin ir a DynamoDB.
# stale-if-error: si DynamoDB cae al recargar (error del SDK, timeout o
# circuito abierto), se sigue sirviendo el ultimo snapshot hasta
# ttl + stale-if-error desde que se cargo; despues, 503.
app.snapshot.ttl=PT60S
app.snapshot.stale-if-error=PT2M
# Ventana en la que POST /api/reportes/generar con los mismos parametros (y los
# mismos datos) devuelve el mismo reporte en vez de generar otro. PT0S = off.
app.reporte.idempotencia-ventana=PT5M
# %test: sin snapshot "fresco" para que los tests que escriben por repositorio
# y leen por REST vean siempre el dato real (el respaldo ante caida sigue activo
# y se prueba aparte en SnapshotCacheTest).
%test.app.snapshot.ttl=PT0S
